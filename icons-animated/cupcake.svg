<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      /* hidden only in the from-frame: fill-mode backwards makes that cover the
         delay, so a staggered row never sits showing the dot a round line-cap
         paints at dashoffset 1 */
      from { stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden }
      1% { visibility: visible }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.46s;animation-delay:0.00s" d="M 12.6 25.6 C 12.1 24.6, 11.9 23.5, 11.8 22.4 C 12.5 21.3, 13.3 20.4, 14.3 19.6 C 15.4 19.2, 16.5 19, 17.7 19 C 18.2 18, 18.8 17, 19.5 16.2 C 20.1 15.7, 20.9 15.4, 21.6 15.1 C 22.4 14.7, 23.3 14.4, 24.2 14.3 C 24.9 14.5, 25.5 14.8, 26 15.3 C 26.8 15.3, 27.5 15.5, 28.2 15.9 C 29 16.9, 29.6 17.9, 30.2 19.1 C 31.4 19.2, 32.6 19.4, 33.8 19.9 C 34.7 20.6, 35.4 21.4, 36.1 22.3 C 36 23.4, 35.8 24.5, 35.4 25.5 C 27.8 26.3, 20.2 26.4, 12.6 25.6 Z"/>
    <path pathLength="1" style="animation-duration:0.34s;animation-delay:0.32s" d="M 14.5 25.8 C 14.9 30.4, 15.4 35.1, 16.1 39.7 C 21.5 39.8, 26.8 39.7, 32.2 39.5 C 32.8 34.9, 33.3 30.3, 33.6 25.7"/>
    <path pathLength="1" style="animation-duration:0.17s;animation-delay:0.56s" d="M 23 8.7 C 24.8 8, 26.5 9, 27 10.9 C 27.5 12.9, 25.7 14.2, 24 14.3 C 22 14.3, 20.7 12.9, 21.1 11 C 21.4 8.9, 23.4 8.1, 24.9 8.7 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.68s" d="M 20.3 26 C 20.3 30.4, 20.5 34.8, 20.9 39.2"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.79s" d="M 27.3 26.1 C 27 30.5, 26.9 34.9, 26.9 39.3"/>
  </g>
</svg>
