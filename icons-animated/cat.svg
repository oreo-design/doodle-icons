<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      /* hidden only in the from-frame: fill-mode backwards makes that cover the
         delay, so a staggered row never sits showing the dot a round line-cap
         paints at dashoffset 1 */
      from { stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden }
      1% { visibility: visible }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.70s;animation-delay:0.00s" d="M 24.1 13.3 C 24.6 13.3, 25 13.4, 25.4 13.7 C 26 13.5, 26.5 13.6, 27.1 13.7 C 28.6 12.4, 30.3 11.2, 32 10.2 C 33.7 10, 35.4 10, 37.2 10.1 C 37.5 12.1, 37.7 14.2, 37.6 16.2 C 37.3 18, 36.8 19.7, 36.1 21.3 C 36.7 22, 37.1 22.8, 37.4 23.7 C 37.7 24.5, 37.9 25.3, 38 26.2 C 36.9 29.3, 35.5 32.3, 33.8 35.1 C 30.6 36.4, 27.3 37.5, 24 38.2 C 20.4 36.7, 16.9 35, 13.7 32.8 C 12.3 30.7, 11.1 28.5, 10.1 26.2 C 10.1 25.3, 10.2 24.4, 10.6 23.5 C 10.7 22.7, 11 21.9, 11.4 21.1 C 10.8 19.5, 10.4 17.9, 10.1 16.2 C 10.1 14.1, 10.4 12, 10.8 10 C 12.4 9.9, 14 10, 15.6 10.3 C 17.5 11.2, 19.2 12.4, 20.9 13.6 C 21.8 13.4, 22.9 13.4, 23.9 13.5 C 23.9 13.3, 23.9 13.3, 24.1 13.3 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.49s" d="M 17.5 27.4 C 17.5 27.8, 17.7 28, 17.9 28.3"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.59s" d="M 30.1 27.1 C 30 27.5, 30 27.9, 30.2 28.3"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.70s" d="M 22.5 30.6 C 23.4 30.5, 24.3 30.5, 25.1 30.7 C 24.8 31.2, 24.5 31.7, 24 31.9 C 23.5 31.6, 23.1 31.2, 22.8 30.7 C 22.8 30.5, 22.7 30.5, 22.5 30.6 Z"/>
