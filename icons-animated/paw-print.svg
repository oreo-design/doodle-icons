<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      /* hidden only in the from-frame: fill-mode backwards makes that cover the
         delay, so a staggered row never sits showing the dot a round line-cap
         paints at dashoffset 1 */
      from { stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden }
      1% { visibility: visible }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.16s;animation-delay:0.00s" d="M 21.8 8.5 C 23.8 8.4, 25.3 9.6, 25.4 11.1 C 25.7 12.8, 24.5 14.7, 22.7 14.7 C 21 14.7, 19.5 13.6, 19.2 11.8 C 19.2 10.2, 20.6 8.7, 22.2 8.6 Z"/>
    <path pathLength="1" style="animation-duration:0.16s;animation-delay:0.11s" d="M 33.1 14.7 C 34.7 14.7, 36.5 16.1, 36.4 17.8 C 36.2 19.6, 34.6 20.8, 33.1 20.9 C 31.3 20.7, 29.8 19.2, 30.2 17.5 C 30.2 15.7, 31.7 14.3, 33.7 14.7 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.22s" d="M 36.7 27 C 38.2 27.1, 39.3 28.4, 39.5 30.2 C 39.2 31.8, 38 32.9, 36.6 33.2 C 34.9 33.3, 33.7 32.5, 33.2 30.8 C 33 29.4, 34 27.7, 35.4 27.2 Z"/>
    <path pathLength="1" style="animation-duration:0.47s;animation-delay:0.33s" d="M 19.4 21.1 C 20.3 21.1, 21.3 21.1, 22.2 21.4 C 23.2 21.8, 24.1 22.4, 24.9 23.1 C 25.5 23.9, 26 24.7, 26.4 25.5 C 26.8 26.5, 27 27.6, 27.1 28.7 C 27.3 30.4, 27.2 32.1, 27 33.8 C 27 34.7, 26.9 35.5, 26.6 36.3 C 26.3 36.9, 25.8 37.4, 25.3 37.8 C 24.8 38.4, 24.2 38.9, 23.5 39.2 C 22.7 39.4, 22 39.5, 21.2 39.4 C 20.6 39.5, 19.9 39.4, 19.4 39.2 C 18.7 38.7, 18.1 38.2, 17.6 37.5 C 17 37, 16.5 36.3, 16.2 35.6 C 15.7 34.8, 15.3 33.8, 15.1 32.8 C 14.1 32.5, 13.2 32, 12.4 31.4 C 11.6 31.3, 10.9 31, 10.2 30.6 C 9.6 30.1, 9.2 29.5, 8.8 28.8 C 8.5 28.1, 8.4 27.4, 8.3 26.6 C 8.3 26, 8.4 25.3, 8.7 24.7 C 8.9 23.9, 9.3 23.2, 9.8 22.6 C 10.4 22.1, 11 21.7, 11.7 21.4 C 12.4 21, 13.1 20.8, 13.9 20.7 C 15.7 20.6, 17.6 20.8, 19.4 21.1 Z"/>
