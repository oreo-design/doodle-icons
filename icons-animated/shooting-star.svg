<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      /* hidden only in the from-frame: fill-mode backwards makes that cover the
         delay, so a staggered row never sits showing the dot a round line-cap
         paints at dashoffset 1 */
      from { stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden }
      1% { visibility: visible }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.56s;animation-delay:0.00s" d="M 30.8 8.1 C 31.8 10.4, 32.7 12.6, 33.7 14.8 C 36.1 15.1, 38.5 15.4, 40.9 15.8 C 39.1 17.4, 37.3 19, 35.5 20.5 C 36.1 22.9, 36.6 25.2, 36.9 27.6 C 34.9 26.4, 32.8 25.1, 30.8 23.9 C 28.8 25.1, 26.7 26.4, 24.7 27.6 C 25 25.2, 25.5 22.9, 26.1 20.5 C 24.3 19, 22.5 17.4, 20.7 15.8 C 23.1 15.4, 25.5 15.1, 27.9 14.8 C 28.9 12.6, 29.8 10.4, 30.8 8.1 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.39s" d="M 9.2 39.1 C 12.7 35.8, 16.1 32.3, 19.3 28.7"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.49s" d="M 7.4 31.1 C 11.1 27.7, 14.7 24.3, 18.2 20.7"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.60s" d="M 16.6 40.2 C 19.2 37.8, 21.7 35.4, 24 32.8"/>
  </g>
</svg>
