    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.55s" d="M 36.3 16.2 C 37.3 16.7, 38.4 17, 39.5 17.1 C 38.4 17.1, 37.4 17.3, 36.4 17.7"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.65s" d="M 20.8 33.4 C 20.7 34.9, 20.8 36.5, 21 38"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.76s" d="M 26.8 33 C 26.8 34.7, 26.9 36.4, 27.1 38.1"/>
