<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      /* hidden only in the from-frame: fill-mode backwards makes that cover the
         delay, so a staggered row never sits showing the dot a round line-cap
         paints at dashoffset 1 */
      from { stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden }
      1% { visibility: visible }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.00s" d="M 8.5 19.1 C 9 18.4, 9.4 17.7, 9.6 16.8 C 10.3 16.2, 10.8 15.5, 11.3 14.7 C 11.5 15.3, 12 15.8, 12.5 16.3 C 13 16.9, 13.5 17.3, 14.2 17.7 C 14.7 17.5, 15.1 17.1, 15.4 16.6 C 16 15.9, 16.4 15.1, 16.6 14.3 C 17 13.9, 17.2 13.4, 17.2 12.8"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.10s" d="M 26.6 33.6 C 27.2 32.8, 27.8 32, 28.2 31.1 C 28.9 30.5, 29.4 29.9, 29.9 29.1 C 30.2 29.8, 30.6 30.3, 31.1 30.8 C 31.6 31.5, 32.3 32.1, 33.1 32.5 C 33.6 32.2, 34 31.8, 34.3 31.3 C 34.8 30.8, 35.2 30.2, 35.4 29.5 C 35.9 29, 36.2 28.5, 36.3 27.9"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.21s" d="M 28.9 11 C 30.4 11.3, 31.8 11.8, 33.2 12.4 C 32.9 14, 32.4 15.5, 31.8 16.9 C 30.2 16.8, 28.7 16.5, 27.2 16 C 27.6 14.3, 28.1 12.6, 28.9 11 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.32s" d="M 11.3 30.5 C 13.2 31, 15.1 31.7, 16.9 32.5 C 15.4 34.1, 13.8 35.5, 12.1 36.8 C 11.6 34.7, 11.4 32.7, 11.3 30.5 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.42s" d="M 21.3 24.2 C 21.2 23.5, 22.3 22.8, 22.9 23.1 C 23.7 23.7, 23.5 24.8, 22.8 25 C 22 25.3, 21.1 24.7, 21.3 23.6 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.53s" d="M 35.7 20.5 C 35.9 19.6, 36.9 19.1, 37.5 19.7 C 38.2 20, 38.2 21.3, 37.1 21.5 C 36 22, 35.3 21.1, 35.7 20.1 Z"/>
