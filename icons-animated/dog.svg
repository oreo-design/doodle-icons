<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      /* hidden only in the from-frame: fill-mode backwards makes that cover the
         delay, so a staggered row never sits showing the dot a round line-cap
         paints at dashoffset 1 */
      from { stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden }
      1% { visibility: visible }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.00s" d="M 22.6 30.8 C 23.5 30.7, 24.3 30.7, 25.1 30.9 C 24.7 31.4, 24.2 31.7, 23.6 32 C 23.1 31.7, 22.8 31.3, 22.6 30.8 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.10s" d="M 29.8 27.1 C 29.7 27.5, 29.8 27.8, 30 28.1"/>
    <path pathLength="1" style="animation-duration:0.34s;animation-delay:0.21s" d="M 11.8 23 C 11.6 24.6, 11.5 26.2, 11.6 27.9 C 12.5 30.4, 13.6 32.9, 14.8 35.3 C 17.8 36.3, 20.8 37.2, 23.9 37.9 C 27 36.7, 30 35.4, 33 33.9 C 34.2 32.1, 35.3 30.2, 36.2 28.2 C 36.2 26.5, 36 24.7, 35.6 23"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.45s" d="M 17.4 27.1 C 17.3 27.4, 17.4 27.7, 17.5 27.9"/>
    <path pathLength="1" style="animation-duration:0.54s;animation-delay:0.55s" d="M 18.2 18.7 C 17.6 19.3, 17.2 20, 17 20.8 C 16.2 21.3, 15.5 21.9, 15 22.6 C 13.7 22.5, 12.3 22.5, 11 22.7 C 10.5 22, 9.9 21.4, 9.1 20.9 C 9.7 19.1, 10.2 17.2, 10.4 15.3 C 12.2 13.7, 13.9 11.9, 15.5 10 C 16.7 10.4, 18 10.6, 19.3 10.7 C 19.7 11.7, 20.2 12.6, 20.8 13.4 C 22.9 13.6, 25 13.6, 27.1 13.5 C 27.8 12.7, 28.4 11.8, 28.8 10.8 C 30.1 10.8, 31.4 10.6, 32.7 10.2 C 34.2 12, 35.8 13.8, 37.6 15.4 C 37.8 17.3, 38.3 19.2, 38.9 21 C 38.3 21.5, 37.8 22.1, 37.4 22.7 C 36 22.5, 34.6 22.6, 33.1 22.8 C 32.5 22, 31.7 21.5, 30.8 21 C 30.6 20.2, 30.3 19.5, 29.8 18.8"/>
