<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      /* hidden only in the from-frame: fill-mode backwards makes that cover the
         delay, so a staggered row never sits showing the dot a round line-cap
         paints at dashoffset 1 */
      from { stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden }
      1% { visibility: visible }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.48s;animation-delay:0.00s" d="M 8.5 29.6 C 16.5 28.9, 24.5 28.9, 32.5 30.1 C 32.8 32.5, 32.8 35, 32.5 37.4 C 24.6 38.1, 16.7 37.9, 8.7 37.1 C 8.4 34.6, 8.3 32.1, 8.5 29.6 Z"/>
    <path pathLength="1" style="animation-duration:0.32s;animation-delay:0.34s" d="M 10.8 30 C 11.1 29.4, 11.2 28.8, 11 28.1 C 11.4 27.2, 11.6 26.3, 11.6 25.3 C 12.1 24.4, 12.4 23.4, 12.6 22.4 C 13 21.6, 13.3 20.8, 13.5 19.9 C 14.1 19.2, 14.6 18.4, 15 17.5 C 15.6 17, 16.2 16.3, 16.6 15.5 C 17.7 14.8, 18.8 14, 19.7 13.1 C 20.9 12.6, 22 12, 23.1 11.2 C 24.1 11.3, 25.1 11, 26 10.7 C 27.2 11, 28.4 11.2, 29.6 11.2 C 30.3 11.6, 31.1 11.9, 31.9 11.9 C 32.5 12.7, 33.2 13.4, 34 13.9 C 34.4 14.8, 34.9 15.7, 35.6 16.4 C 35.6 17.2, 35.8 18, 36.2 18.7"/>
    <path pathLength="1" style="animation-duration:0.16s;animation-delay:0.56s" d="M 36.3 18.8 C 38 18.6, 39.5 19.8, 39.5 21.7 C 39.6 23.6, 38.3 25, 36.4 24.8 C 34.8 24.9, 33.6 23.5, 33.5 21.6 C 33.8 19.8, 35.1 18.4, 36.9 18.8 Z"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.67s" d="M 29.5 30 C 29.6 29.1, 29.5 28.3, 29.3 27.4 C 29.3 26.5, 29.2 25.7, 28.9 24.8 C 28.6 23.3, 28.2 21.9, 27.6 20.5"/>
  </g>
</svg>
