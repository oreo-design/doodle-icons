    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.45s" d="M 30.1 33.5 C 29.4 31.5, 28.6 29.5, 27.6 27.6 C 27.7 25.4, 27.7 23.2, 27.5 21 C 28.6 19.1, 29.5 17, 30.3 14.9"/>
