<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      /* hidden only in the from-frame: fill-mode backwards makes that cover the
         delay, so a staggered row never sits showing the dot a round line-cap
         paints at dashoffset 1 */
      from { stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden }
      1% { visibility: visible }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.49s;animation-delay:0.00s" d="M 26.7 30.8 C 25.3 31.4, 23.7 31.5, 22 31.1 C 17.5 30.1, 14.7 26, 15.7 21.5 C 15.9 20.3, 16.4 19.3, 17.1 18.3 C 12 19.3, 8.3 23.7, 8.5 29 C 8.8 34.6, 13.5 38.9, 19 38.6 C 22.7 38.4, 25.6 35.2, 26.7 30.8 Z"/>
    <path pathLength="1" style="animation-duration:0.33s;animation-delay:0.34s" d="M 29.6 9.4 C 30.2 10.8, 30.7 12, 31.3 13.4 C 32.7 13.5, 34.1 13.7, 35.5 14 C 34.4 14.9, 33.4 15.8, 32.3 16.7 C 32.7 18.1, 32.9 19.4, 33.2 20.9 C 32 20.2, 30.7 19.4, 29.6 18.7 C 28.4 19.4, 27.1 20.2, 25.9 20.9 C 26.2 19.4, 26.4 18.1, 26.8 16.7 C 25.7 15.8, 24.7 14.9, 23.6 14 C 25 13.7, 26.4 13.5, 27.8 13.4 C 28.5 12, 29 10.8, 29.6 9.4 Z"/>
    <path pathLength="1" style="animation-duration:0.23s;animation-delay:0.57s" d="M 35.3 26.2 C 35.7 27.2, 36.1 28.1, 36.6 29 C 37.6 29.1, 38.6 29.3, 39.5 29.5 C 38.8 30.1, 38.1 30.8, 37.3 31.4 C 37.5 32.4, 37.7 33.4, 37.9 34.4 C 37 33.9, 36.1 33.3, 35.3 32.8 C 34.4 33.3, 33.6 33.9, 32.7 34.4 C 32.8 33.4, 33.1 32.4, 33.3 31.4 C 32.5 30.8, 31.8 30.1, 31.1 29.5 C 32 29.3, 33 29.1, 34 29 C 34.4 28.1, 34.9 27.2, 35.3 26.2 Z"/>
  </g>
</svg>
