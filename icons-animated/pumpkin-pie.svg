<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      /* hidden only in the from-frame: fill-mode backwards makes that cover the
         delay, so a staggered row never sits showing the dot a round line-cap
         paints at dashoffset 1 */
      from { stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden }
      1% { visibility: visible }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.38s;animation-delay:0.00s" d="M 35 19.9 C 35.8 20.2, 36.6 20.7, 37.4 21.3 C 38.7 21.7, 39.4 22.7, 39.5 24.1 C 39.5 25.4, 38.9 26.3, 37.6 26.7 C 36 28.3, 34.1 28.8, 31.9 28.7 C 29.4 29.6, 26.8 29.8, 24.1 29.1 C 21.4 29.9, 18.8 29.7, 16.2 28.7 C 14 28.9, 12.1 28.2, 10.3 26.8 C 9 26.4, 8.5 25.4, 8.5 24 C 8.5 22.7, 9 21.8, 10.3 21.5 C 11.2 20.8, 12.2 20.3, 13.2 19.9"/>
    <path pathLength="1" style="animation-duration:0.35s;animation-delay:0.26s" d="M 8.9 25.8 C 9.6 29.2, 10.5 32.5, 11.6 35.8 C 19.8 36, 28 36.1, 36.2 35.9 C 37.3 32.5, 38.3 29.1, 39.2 25.6"/>
    <path pathLength="1" style="animation-duration:0.28s;animation-delay:0.51s" d="M 18.5 21.7 C 18.4 20.5, 18.4 19.3, 18.5 18.2 C 19.3 17.3, 20.1 16.5, 21.1 15.9 C 21.4 14.9, 21.8 13.9, 22.4 12.9 C 23.3 12.5, 24.2 12.2, 25.2 12 C 25.9 12.6, 26.6 13.2, 27.1 13.9 C 27.9 14.3, 28.7 14.9, 29.4 15.6 C 29.7 16.6, 29.8 17.7, 29.8 18.9 C 29.8 19.9, 29.6 20.9, 29.2 21.8 C 27.6 22.3, 25.9 22.7, 24.2 22.8 C 22.3 22.6, 20.4 22.3, 18.5 21.7 Z"/>
  </g>
</svg>
