    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.35s" d="M 24.2 24.7 C 24.1 29.2, 24 33.7, 24.1 38.2"/>
    <path pathLength="1" style="animation-duration:0.22s;animation-delay:0.45s" d="M 24 38.3 C 24.8 38.8, 25.7 39.2, 26.6 39.4 C 27.7 39.6, 28.8 39.6, 29.9 39.5 C 30.9 38.8, 31.8 37.9, 32.6 36.9 C 32.8 35.2, 32.9 33.6, 32.8 31.9 C 31.2 31.6, 29.7 31.4, 28.2 31.5 C 27.1 32.1, 26.1 32.8, 25.2 33.7 C 24.6 35.2, 24.2 36.8, 24 38.4"/>
