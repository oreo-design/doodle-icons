<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      /* hidden only in the from-frame: fill-mode backwards makes that cover the
         delay, so a staggered row never sits showing the dot a round line-cap
         paints at dashoffset 1 */
      from { stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden }
      1% { visibility: visible }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.34s;animation-delay:0.00s" d="M 22.1 21.9 C 21.2 23.9, 20.5 25.9, 19.8 28 C 18.2 28.8, 16.8 29.9, 15.3 30.9 C 13.8 29.3, 12.2 27.9, 10.6 26.6 C 10.1 25, 9.5 23.5, 8.8 22.1 C 9.1 21.2, 9.2 20.4, 9.2 19.5 C 9.7 18.8, 10.2 18.1, 10.7 17.2 C 11.4 17, 12.1 16.6, 12.9 16 C 13.7 15.9, 14.5 15.7, 15.3 15.3 C 16.2 15.6, 17.1 15.8, 18 15.9 C 18.7 16.5, 19.3 17, 20.2 17.3 C 20.6 18.1, 21 18.8, 21.6 19.3 C 21.5 20.3, 21.6 21.1, 21.9 21.9"/>
    <path pathLength="1" style="animation-duration:0.34s;animation-delay:0.24s" d="M 39.2 15.1 C 38.4 17.1, 37.6 19.1, 36.9 21.1 C 35.3 22, 33.9 23, 32.4 24.1 C 30.9 22.5, 29.3 21.1, 27.7 19.7 C 27.2 18.2, 26.7 16.7, 25.9 15.3 C 26.2 14.4, 26.3 13.5, 26.3 12.7 C 26.9 11.9, 27.3 11.3, 27.8 10.4 C 28.6 10.1, 29.2 9.7, 30 9.2 C 30.8 9.1, 31.6 8.9, 32.4 8.5 C 33.3 8.8, 34.2 9, 35.1 9.1 C 35.8 9.6, 36.5 10.1, 37.3 10.5 C 37.7 11.3, 38.1 11.9, 38.7 12.5 C 38.6 13.4, 38.7 14.2, 39 15.1"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.47s" d="M 15.5 30.8 C 18.1 33.8, 20.8 36.7, 23.6 39.4"/>
    <path pathLength="1" style="animation-duration:0.15s;animation-delay:0.58s" d="M 32.5 24.2 C 29.5 29.2, 26.6 34.3, 23.9 39.4"/>
