<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path {
      fill: none; stroke: #2b2a33; stroke-width: 3.4;
      stroke-linecap: round; stroke-linejoin: round;
      animation-name: draw;
      animation-timing-function: cubic-bezier(.65,.05,.36,1);
      animation-fill-mode: backwards;
    }
    /* drawn is the resting state; the animation hides the ink and puts it
       back, so a still render shows the finished icon, not nothing */
    @keyframes draw {
      /* hidden only in the from-frame: fill-mode backwards makes that cover the
         delay, so a staggered row never sits showing the dot a round line-cap
         paints at dashoffset 1 */
      from { stroke-dasharray: 1; stroke-dashoffset: 1; visibility: hidden }
      1% { visibility: visible }
      to { stroke-dasharray: 1; stroke-dashoffset: 0 }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="animation-duration:0.70s;animation-delay:0.00s" d="M 11.6 17.7 C 19.8 16.7, 28.1 16.6, 36.4 17.5 C 37.4 24.8, 37.6 32.1, 37 39.5 C 28.3 40.5, 19.6 40.6, 10.9 39.7 C 10.3 32.3, 10.6 25, 11.6 17.7 Z"/>
    <path pathLength="1" style="animation-duration:0.19s;animation-delay:0.49s" d="M 18.1 17.5 C 18.3 16.6, 18.3 15.8, 18 14.9 C 18.4 14, 18.5 13, 18.4 12 C 19.3 11.2, 20 10.3, 20.6 9.2 C 21.8 9.3, 22.9 9.1, 24.1 8.7 C 25 9.1, 26 9.4, 27.1 9.4 C 27.7 10.4, 28.5 11.3, 29.4 12 C 29.4 13.1, 29.6 14.2, 30 15.3 C 29.8 16.1, 29.7 16.9, 29.9 17.7"/>
    <path pathLength="1" style="animation-duration:0.19s;animation-delay:0.63s" d="M 11.6 28.6 C 20 28.7, 28.3 28.7, 36.7 28.6"/>
    <path pathLength="1" style="animation-duration:0.27s;animation-delay:0.76s" d="M 19 28.4 C 18.7 28.2, 18.3 28.2, 17.8 28.3 C 17.6 27.9, 17.3 27.8, 16.9 27.6 C 16.8 27.2, 16.6 26.9, 16.3 26.6 C 16.4 26.3, 16.3 26, 16.1 25.7 C 16.3 25.3, 16.3 24.9, 16.3 24.5 C 16.6 24.4, 16.8 24.1, 17 23.7 C 17.3 23.6, 17.6 23.5, 17.7 23.2 C 18.1 23.2, 18.5 23.1, 18.9 22.8 C 19.5 23.2, 20.1 23.3, 20.6 23.4 C 21.2 23.9, 21.7 24.3, 22.4 24.5 C 22.7 25.2, 23.2 25.8, 23.7 26.4 C 23.6 27.1, 23.6 27.8, 23.7 28.4 C 24 27.8, 24.1 27.2, 24.1 26.4 C 24.6 25.9, 25 25.3, 25.2 24.7 C 26 24.4, 26.6 24, 27.2 23.4 C 27.9 23.4, 28.4 23.2, 29 22.9 C 29.3 23, 29.6 23, 30 22.8 C 30.2 23.2, 30.6 23.4, 31 23.5 C 31 24, 31.3 24.4, 31.6 24.7 C 31.5 25.1, 31.6 25.4, 31.9 25.7 C 31.7 26, 31.6 26.4, 31.6 26.7 C 31.3 27, 31 27.4, 30.8 27.8 C 30.5 27.8, 30.2 27.9, 30 28.2 C 29.7 28, 29.4 28.1, 29 28.3"/>
